[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuanshu"
version = "0.1.0"
description = "Auditable Chinese calendar, BaZi, partial Zi Wei, bounded Qimen, and OAuth resource verification with MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.6,<3",
  "pyswisseph==2.10.3.2",
  "tzdata>=2024.1",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
professional = ["iztro-py>=0.1,<1"]
# Optional AI chat: Claude via the official Anthropic SDK, or any OpenAI-compatible endpoint.
chat = ["anthropic>=1.13,<2"]
chat-openai = ["openai>=3,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
xuanshu = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
